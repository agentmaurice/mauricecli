name: Instructions des agents

on:
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - README.md
      - docs/agent-instructions.md
      - .github/workflows/agent-instructions.yml
  push:
    branches: [main, "codex/**"]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - README.md
      - docs/agent-instructions.md
      - .github/workflows/agent-instructions.yml
  workflow_call:

permissions:
  contents: read

jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier le pointeur public et son chargement
        shell: python
        run: |
          import os
          from pathlib import Path

          public_url = "https://raw.githubusercontent.com/agentmaurice/mauricecli/main/docs/agent-instructions.md"
          pointer = Path("AGENTS.md").read_text(encoding="utf-8")
          if public_url not in pointer or "README.md" not in pointer or not Path("README.md").is_file():
              raise SystemExit("Point d’entrée public ou README manquant")
          if "<!-- agentmaurice:common:" in pointer:
              raise SystemExit("Ancien bloc recopié dans AGENTS.md")
          if "@AGENTS.md" not in Path("CLAUDE.md").read_text(encoding="utf-8").splitlines():
              raise SystemExit("CLAUDE.md doit importer AGENTS.md")
          if os.environ["GITHUB_REPOSITORY"] == "agentmaurice/mauricecli":
              view = Path("docs/agent-instructions.md").read_text(encoding="utf-8")
              if view.count("**Avant le patch.**") != 1 or "code qui prend la décision" not in view:
                  raise SystemExit("Consigne pré-patch absente de la vue publiée")
              if "<!-- agentmaurice:" in view or "workspace/AGENTS-common.md" in view:
                  raise SystemExit("La vue publiée contient des éléments internes")
